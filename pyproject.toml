[project]
name = "finlens"
version = "0.1.0"
description = "Cited answers to questions about NSE-listed companies, from their annual reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "rapidfuzz>=3.10",
    "pymupdf>=1.25",
    "alembic>=1.20.1",
]

[project.optional-dependencies]
# GPU OCR on Modal (src/finlens/ingestion/ocr)
ocr = ["modal>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["src/finlens/ingestion/ocr"]
