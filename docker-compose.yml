services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finlens
      POSTGRES_PASSWORD: finlens
      POSTGRES_DB: finlens
    ports:
      - "5433:5432"   # 5432 is often taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlens"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
